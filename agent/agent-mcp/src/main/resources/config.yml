# VitaminMCP — observability for a running Minecraft server, over MCP.
#
# The endpoint reaches server internals, so the defaults below assume this is a production
# server. Read the security notes before changing bind-address or read-only.

enabled: true

# ---------------------------------------------------------------------------- endpoint

# Loopback by default. Set this to 0.0.0.0 (or a specific interface) to let another machine
# reach the agent — that is a supported setup, not a hack, but it requires the tls block below.
bind-address: "127.0.0.1"
port: 25585

# REQUIRED — but left empty it fills itself in. On a start with no token the plugin generates
# one, writes it here, and carries on; an unauthenticated endpoint is never opened either way.
# Replace it with your own at any time, for example:
#   openssl rand -base64 32
auth-token: ""

# Where a client on this same machine looks the connection details up, so nothing has to be
# copied out of this file by hand: host, both ports and the token above are written to
# ~/.vitaminmcp/agents/<port>.properties while the agent is running, and removed when it stops.
#
# It is readable only by the user the server runs as, and only from this machine. That user can
# already read this file, so it exposes nothing new — set it to false anyway if you would rather
# the agent wrote nothing outside the server directory. A client elsewhere is unaffected: it is
# told the token, as it always was.
local-handshake: true

# Read-only exposes only the query tools. State-changing tools stay unexposed entirely, so a
# default install cannot alter the server even with a valid token. Leave this on unless you
# specifically need otherwise.
read-only: true

# ------------------------------------------------------------------------- console log

# What the agent writes to the server console as it works. Two lines per MCP call: one when it
# arrives, naming the tool and the arguments, and one when it answers, with how long it took and
# what came back. Arguments and answers are truncated — the full payload went to the client.
#
#   full     one line per call with arguments, one with the answer (default)
#   summary  the same two lines, without arguments or answers
#   off      lifecycle only
#
# 'off' still logs a refused token and every state-changing call. Turning the console quiet is
# not the same as giving up the record of what the agent did to your server.
activity-log: full

# --------------------------------------------------------------------------------- tls

# Required once bind-address is anything other than loopback. The agent refuses to start
# otherwise, and that is deliberate: the auth token above grants console access, and over plain
# HTTP it crosses the network in clear text where anything on the path can read it.
#
# Two ways to satisfy it.
#
# 1. The agent serves HTTPS itself. Point it at a PKCS#12 keystore holding your certificate and
#    key. If you already have a certificate for this host (Let's Encrypt, your panel, your
#    host's wildcard), convert it once:
#
#      openssl pkcs12 -export -out agent.p12 -inkey privkey.pem -in fullchain.pem
#
# 2. Something in front already terminates TLS — nginx, Caddy, a load balancer. Set
#    terminated-upstream and the agent serves plain HTTP to that proxy only. You are asserting
#    the hop between them is not the public internet; if it is, nothing is protecting the token.
#
# No domain, no certificate authority? Make a self-signed one and let the client pin it:
#
#   keytool -genkeypair -alias agent -keyalg RSA -keysize 2048 -storetype PKCS12 \
#     -keystore agent.p12 -storepass CHANGEME -validity 825 -dname "CN=vitaminmcp-agent"
#
# On startup the agent prints that certificate's SHA-256 next to everything else a client needs.
# Passing it as session_start's 'tlsFingerprint' trusts that one certificate and nothing else —
# no truststore, no files to copy. Note this is not the same as skipping verification: a pin is
# narrower than a certificate authority, since it matches one certificate rather than anything
# an authority chooses to sign.
tls:
  enabled: false
  keystore: ""
  keystore-password: ""
  terminated-upstream: false

# ------------------------------------------------------------------------------- oauth

# Off by default, which is right for a loopback endpoint on a machine you already control:
# the static auth-token above is a shared secret, and a shared secret is fine when there is
# exactly one holder and one machine.
#
# Turn this on when the endpoint is reachable by anything you do not personally run. An OAuth
# token carries an identity, an audience and an expiry, and can be revoked centrally — none of
# which a static token can do.
#
# This agent is a *resource server*: it validates tokens, it does not issue them. Point it at
# an authorization server you already have. Tokens are checked by introspection (RFC 7662)
# rather than verified locally, so revoking one takes effect immediately instead of at expiry.
#
# The static token keeps working alongside this, so local tooling does not break.
oauth:
  enabled: false
  issuer: ""
  introspection-url: ""
  client-id: ""
  client-secret: ""
  # This server's canonical URL. Tokens must be audienced to it, which is what stops a token
  # issued for another MCP server being replayed here by that server.
  resource-url: ""
  required-scopes: []

# ----------------------------------------------------------------------------- capture

# Retained records. Older ones are overwritten once these fill, and every query reports how
# many it could not see, so raising these trades memory for how far back you can look.
event-buffer-size: 100000
log-buffer-size: 20000

# Distinct exceptions kept, each with its occurrence count and first-seen time.
max-exception-groups: 1000

# Ceiling on one query response: records and serialized bytes, whichever fills first. Every
# query pages with nextCursor, so these trade round trips against response size. The reader is
# an AI client whose context window pays for every byte — raising max-response-bytes mostly
# spends that context, it does not show more history than paging would.
max-response-items: 200
max-response-bytes: 25600

# High-frequency events — PlayerMoveEvent, BlockPhysicsEvent, ChunkLoadEvent, entity movement —
# are not captured by default. BlockPhysicsEvent alone can fire thousands of times per tick and
# would overwrite the entire buffer within seconds, discarding everything you actually wanted.
#
# Turning this on captures them. They still will not appear in events_query results unless the
# query names the type explicitly.
capture-high-frequency: false

# Additional event type simple names to treat as high frequency, e.g. a chatty plugin event.
extra-high-frequency: []

# Types to pull back out of the high-frequency list, when you specifically want one captured
# and returned normally.
reinstate-types: []

# Packages searched for event classes. Empty uses the defaults:
#   org.bukkit.event, io.papermc.paper.event, com.destroystokyo.paper.event
# Add a plugin's event package to capture its custom events too.
scan-packages: []
