# Cuts a release: the three jars, the npm launcher, and the registry entry that points at it.
#
# Ordering is not arbitrary. The npm package pins the sha256 of jars that must already be
# downloadable, and the registry validates that the npm package already exists and claims this
# server name. So: jars, then npm, then registry — and every check that can fail runs before the
# first irreversible step, because none of the three can be unpublished.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

  # For finishing a release that stopped partway. Every step below asks whether its work is
  # already done, so a dispatch for a version that is half published completes it rather than
  # repeating it.
  workflow_dispatch:
    inputs:
      version:
        description: The released version to publish, for example 2.0.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-runners:
    name: Build ${{ matrix.target }} SEA runner
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            asset: bot-runner-win-x64.exe
            os: windows-latest
          - target: linux-x64
            asset: bot-runner-linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            asset: bot-runner-linux-arm64
            os: ubuntu-24.04-arm
          # macOS 13 was retired and macOS 14 is deprecated, so both are named by their current
          # images. Intel is only offered as macos-*-intel now, and a SEA runner has to be built on
          # the architecture it will run on — there is no cross-build that produces a working one.
          #
          # macos-15-intel is a standard runner, not one of the -large images, so it stays free on
          # this public repository. It is also the last x86_64 image Actions will offer: GitHub has
          # it available until August 2027, after which this row has to go and Intel Macs are on
          # the Node source runner.
          - target: darwin-x64
            asset: bot-runner-darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            asset: bot-runner-darwin-arm64
            os: macos-15

    steps:
      # The released source, for the same reason the release job below checks it out: a dispatch
      # runs this file from the default branch, and the runner it ships has to be built from the
      # tag being released rather than from whatever the default branch holds today.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install runner dependencies
        working-directory: bot/bot-runner-node
        run: npm ci

      - name: Build SEA runner
        working-directory: bot/bot-runner-node
        run: npm run build:sea -- ${{ matrix.target }}

      - name: Install viewer dependencies
        if: matrix.target == 'win32-x64'
        working-directory: bot/bot-runner-viewer
        run: npm ci

      - name: Ensure the native canvas binary is present
        if: matrix.target == 'win32-x64'
        working-directory: bot/bot-runner-viewer
        run: npm rebuild canvas --foreground-scripts

      - name: Build trimmed viewer asset
        if: matrix.target == 'win32-x64'
        run: node bot/bot-runner-viewer/scripts/build-viewer-asset.mjs build/dist/assets/bot-runner-viewer-win-x64.tgz

      - name: Ad-hoc sign macOS runner
        if: startsWith(matrix.target, 'darwin-')
        run: codesign --force --sign - build/dist/runners/${{ matrix.asset }}

      # Runs the built exe with no arguments and expects the entry point's own refusal: exit 2 and
      # the usage line. That is the cheapest proof that postject actually injected the bundle —
      # without it the asset is a bare node.exe that would start a REPL on a user's machine.
      - name: Smoke test Windows SEA runner
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          # GitHub runs pwsh with $ErrorActionPreference = 'stop', and PowerShell 7.4 promotes a
          # native command's non-zero exit to a terminating error under it. The exit code this step
          # exists to assert is 2, so without these two lines the call itself kills the script and
          # the assertion below never runs — which is exactly how 2.0.0 failed.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $output = & "build/dist/runners/${{ matrix.asset }}" 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 2 -or ($output -notmatch 'usage: runner.mjs')) {
            Write-Host "SEA runner did not execute its entry point. exit=$code output=$output"
            exit 1
          }
          Write-Host "SEA runner runs its entry point. exit=$code"

          # $LASTEXITCODE is still 2, and pwsh -command hands the step whatever it holds.
          exit 0

      - name: Smoke test Unix SEA runner
        if: startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          set +e
          output=$(build/dist/runners/${{ matrix.asset }} 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 2 ] || ! grep -q 'usage: runner.mjs' <<<"$output"; then
            echo "SEA runner did not execute its entry point. exit=$code output=$output"
            exit 1
          fi
          echo "SEA runner runs its entry point. exit=$code"

      - uses: actions/upload-artifact@v5
        with:
          name: runner-${{ matrix.target }}
          path: |
            build/dist/runners/${{ matrix.asset }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: matrix.target == 'win32-x64'
        with:
          name: viewer-${{ matrix.target }}
          path: build/dist/assets/bot-runner-viewer-win-x64.tgz
          if-no-files-found: error

  release:
    needs: build-runners
    runs-on: ubuntu-latest

    steps:
      # The released source, not the branch. A dispatch runs this file from the default branch,
      # so a workflow fixed after the fact can still finish a release cut before it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Node 22.14+ and npm 11.5.1+ are what trusted publishing needs. The npm CLI picks OIDC up
      # by itself in an environment that offers it and only falls back to NODE_AUTH_TOKEN when it
      # does not, so this costs nothing while the token is still what works.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Use an npm that can authenticate without a token
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Agree on one version
        run: |
          set -euo pipefail
          tag="${VERSION}"
          gradle=$(sed -n 's/^version = "\(.*\)"$/\1/p' \
            build-logic/src/main/kotlin/vitaminmcp.java-conventions.gradle.kts)
          server=$(node -p "require('./server.json').version")
          package=$(node -p "require('./server.json').packages[0].version")

          echo "tag=$tag gradle=$gradle server.json=$server package=$package"
          for found in "$gradle" "$server" "$package"; do
            if [ "$found" != "$tag" ]; then
              echo "::error::Version mismatch: tag $tag, but found $found" >&2
              exit 1
            fi
          done

      - name: Build the jars
        run: ./gradlew dist --no-daemon

      # Into the subdirectory each asset is published from, because upload-artifact roots an
      # artifact at the least common ancestor of its search paths: a single-file path uploads a bare
      # filename carrying no directory to restore. Downloading these flat into build/dist would
      # leave the release step below looking for runners/ and assets/ that are not there.
      - name: Collect platform runner assets
        uses: actions/download-artifact@v5
        with:
          pattern: runner-*
          path: build/dist/runners
          merge-multiple: true

      - name: Collect optional viewer asset
        uses: actions/download-artifact@v5
        with:
          pattern: viewer-*
          path: build/dist/assets
          merge-multiple: true

      # Each publish step checks whether it has already happened. Creating a release with the gh
      # CLI pushes the tag, which triggers this workflow — so a release cut by hand arrives here
      # anyway, and "already done" has to mean carry on rather than fail. It also makes a rerun
      # after a failure halfway down do the right thing, which matters when nothing above can be
      # undone.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then

            # Uploaded, never replaced. A shadow jar is not byte-reproducible — the same source
            # builds a different file every time — so re-uploading would change the bytes a
            # published npm version pins, and turn every install of it into a checksum failure
            # that reads exactly like a compromised download. An asset that is already there is
            # the asset, whatever this run happened to build.
            echo "Release ${VERSION} exists; uploading only assets it does not have."
            present=$(gh release view "${VERSION}" --json assets --jq '.assets[].name')
            for asset in \
              VitaminMCP.jar \
              mcp-server.jar \
              runners/bot-runner-linux-x64 \
              runners/bot-runner-linux-arm64 \
              runners/bot-runner-darwin-x64 \
              runners/bot-runner-darwin-arm64 \
              runners/bot-runner-win-x64.exe \
              assets/bot-runner-viewer-win-x64.tgz; do
              name="${asset##*/}"
              if grep -qx "$name" <<<"$present"; then
                echo "  $name is already published; leaving it alone."
              else
                gh release upload "${VERSION}" "build/dist/$asset"
              fi
            done
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              --generate-notes \
              build/dist/VitaminMCP.jar \
              build/dist/mcp-server.jar \
              build/dist/runners/bot-runner-linux-x64 \
              build/dist/runners/bot-runner-linux-arm64 \
              build/dist/runners/bot-runner-darwin-x64 \
              build/dist/runners/bot-runner-darwin-arm64 \
              build/dist/runners/bot-runner-win-x64.exe \
              build/dist/assets/bot-runner-viewer-win-x64.tgz
          fi

      # Pins what the release actually serves, which on a rerun is not what this run just built.
      - name: Stamp the launcher
        working-directory: npm
        run: node scripts/stamp-checksums.mjs --tag "${VERSION}"

      - name: Publish the launcher
        working-directory: npm
        run: |
          set -euo pipefail
          if npm view "vitaminmcp@${VERSION}" version >/dev/null 2>&1; then
            echo "vitaminmcp@${VERSION} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          name=$(node -p "require('./server.json').name")
          published=$(curl -fsSL \
            "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
            | node -e "
              let body = '';
              process.stdin.on('data', (chunk) => (body += chunk));
              process.stdin.on('end', () => {
                const servers = (JSON.parse(body).servers ?? []).map((entry) => entry.server ?? entry);
                const mine = servers.find((entry) => entry.name === process.argv[1]);
                process.stdout.write(mine?.version ?? '');
              });
            " "$name" || true)

          if [ "$published" = "${VERSION}" ]; then
            echo "${name} ${VERSION} is already in the registry; nothing to publish."
            exit 0
          fi
          mcp-publisher login github-oidc
          mcp-publisher publish

      # Mirrors the release to Modrinth — Modrinth has no GitHub sync of its own, so this step is
      # the sync: one Modrinth version per tag, serving the same plugin jar the GitHub release
      # serves. Guarded like everything above: a version already on Modrinth is left alone (the
      # jar is not byte-reproducible, so re-uploading would publish different bytes under the same
      # version), and a repository without the token — a fork, or before the secret is set — skips
      # rather than fails.
      #
      # The supported floor is 1.21 (docs/design.md §5.4); the ceiling is the newest entry in
      # versions.yaml, so adding a version to the matrix is still the only step in supporting one.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_SLUG: vitaminmcp
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::notice::MODRINTH_TOKEN is not set; skipping the Modrinth publish."
            exit 0
          fi

          # Authorized reads, because a project still in review is invisible to the public API —
          # the token therefore needs the read-projects and read-versions scopes too.
          published=$(curl -fsSL -H "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/${MODRINTH_SLUG}/version" \
            | node -p "JSON.parse(require('fs').readFileSync(0)).some((v) => v.version_number === process.env.VERSION)")
          if [ "$published" = "true" ]; then
            echo "Modrinth already has ${VERSION}; nothing to publish."
            exit 0
          fi

          # Version creation wants the project id, not the slug.
          project_id=$(curl -fsSL -H "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/${MODRINTH_SLUG}" \
            | node -p "JSON.parse(require('fs').readFileSync(0)).id")

          # The same notes the GitHub release shows, which on a rerun are the published notes
          # rather than whatever --generate-notes would produce today.
          gh release view "${VERSION}" --json body --jq .body > modrinth-changelog.md

          # Every release between the floor and the ceiling, in Modrinth's own list of game
          # versions: the range crosses from 1.21.11 into 26.1, so it cannot be spelled by counting.
          ceiling=$(sed -n 's/^  - id: "\(.*\)"$/\1/p' versions.yaml | tail -1)
          curl -fsSL "https://api.modrinth.com/v2/tag/game_version" > modrinth-game-versions.json
          node -e "
            const fs = require('fs');
            const releases = JSON.parse(fs.readFileSync('modrinth-game-versions.json', 'utf8'))
              .filter((tag) => tag.version_type === 'release')
              .map((tag) => tag.version);
            const newest = releases.indexOf(process.argv[2]);
            const oldest = releases.indexOf('1.21');
            if (newest < 0 || oldest < 0 || newest > oldest) {
              throw new Error('Modrinth does not list ' + process.argv[2] + ' as a release above 1.21.');
            }
            const gameVersions = releases.slice(newest, oldest + 1).reverse();
            fs.writeFileSync('modrinth-version.json', JSON.stringify({
              project_id: process.argv[1],
              name: process.env.VERSION,
              version_number: process.env.VERSION,
              changelog: fs.readFileSync('modrinth-changelog.md', 'utf8'),
              dependencies: [],
              game_versions: gameVersions,
              version_type: 'release',
              loaders: ['paper', 'purpur'],
              featured: false,
              file_parts: ['file'],
            }));
          " "$project_id" "$ceiling"

          curl -fsS -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -F "data=<modrinth-version.json" \
            -F "file=@build/dist/VitaminMCP.jar;type=application/java-archive" \
            -o /dev/null
          echo "Published ${VERSION} to Modrinth."
